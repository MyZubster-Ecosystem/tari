---
name: Security audit - daily

'on':
  push:
    paths:
      # Run if workflow changes
      - '.github/workflows/audit.yml'
      # Run on changed dependencies
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      # Run if the configuration file changes
      - '**/audit.toml'
  # Rerun periodicly to pick up new advisories
  schedule:
    - cron: '43 05 * * *'
  # Run manually
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  security_audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Refresh security-sensitive dependencies
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
        run: |
          cargo update -p warp --precise 0.4.3
          cargo update -p h2@0.4.15 --precise 0.4.19
          cargo update -p junit-report
          cargo update -p quick-xml --precise 0.41.0
      - name: Persist refreshed Cargo.lock
        run: |
          if ! git diff --quiet -- Cargo.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.lock
            git commit -m "fix(security): refresh Cargo.lock"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: security-cargo-lock
          path: Cargo.lock
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}