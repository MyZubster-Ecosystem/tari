---
name: Consolidated remediation apply

"on":
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.pull_request.head.ref == 'remediation/consolidated-2026-09-03' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: remediation/consolidated-2026-09-03
      - name: Apply remediation
        run: python3 scripts/remediation_apply.py
      - name: Commit remediation
        run: |
          git rm .github/workflows/remediation_apply.yml scripts/remediation_apply.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add infrastructure/tari_script/src/op_codes.rs
          git add base_layer/wallet/src/transaction_service/storage/sqlite_db.rs
          git add .github/workflows/ci.yml
          git add my_escrow_contract/src/lib.rs
          git commit -m "fix(ci): consolidate release blockers"
          git push origin HEAD:remediation/consolidated-2026-09-03
