---
name: "Consolidated remediation apply"

"on":
  pull_request:
    types:
      - opened

permissions:
  contents: write

jobs:
  apply-remediation:
    if: github.head_ref == 'remediation/consolidated-2026-09-03'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: "remediation/consolidated-2026-09-03"
      - name: Apply validated remediation set
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # MYZ-15: validated tari_script Clippy coercion fix.
          p = Path('infrastructure/tari_script/src/op_codes.rs')
          s = p.read_text()
          old = '''        .chunks_exact(PUBLIC_KEY_LENGTH)\n        .take(num)\n        .map(CompressedKey::from_canonical_bytes)'''
          new = '''        .as_chunks::<PUBLIC_KEY_LENGTH>()\n        .0\n        .iter()\n        .take(num)\n        .map(|bytes| CompressedKey::from_canonical_bytes(&bytes[..]))'''
          if s.count(old) != 1:
              raise SystemExit(f'op_codes: expected one source expression, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))

          # Second Clippy failure exposed by the full CI after the first fix.
          p = Path('base_layer/wallet/src/transaction_service/storage/sqlite_db.rs')
          s = p.read_text()
          old = '''        .chunks_exact(32)\n        .filter_map(|chunk| FixedHash::try_from(chunk).ok())'''
          new = '''        .as_chunks::<32>()\n        .0\n        .iter()\n        .filter_map(|chunk| FixedHash::try_from(&chunk[..]).ok())'''
          if s.count(old) != 1:
              raise SystemExit(f'sqlite_db: expected one source expression, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))

          # MYZ-16: Ledger builder already validated on all four targets.
          p = Path('.github/workflows/ci.yml')
          s = p.read_text()
          old = 'ghcr.io/ledgerhq/ledger-app-builder/ledger-app-builder:5.3.10'
          new = 'ghcr.io/ledgerhq/ledger-app-builder/ledger-app-builder:5.4.2'
          if s.count(old) != 1:
              raise SystemExit(f'ci.yml: expected one old Ledger pin, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))

          # MYZ-14: project-owned Rust source must carry the standard Tari license header.
          p = Path('my_escrow_contract/src/lib.rs')
          s = p.read_text()
          if 'Copyright' in s and 'The Tari Project' in s:
              raise SystemExit('my_escrow_contract/src/lib.rs already has a Tari copyright header')
          header = '''// Copyright 2026. The Tari Project
// Redistribution and use in source and binary forms, with or without modification, are permitted provided that the
// following conditions are met:
// 1. Redistributions of source code must retain the above copyright notice, this list of conditions and the following
// disclaimer.
// 2. Redistributions in binary form must reproduce the above copyright notice, this list of conditions and the
// following disclaimer in the documentation and/or other materials provided with the distribution.
// 3. Neither the name of the copyright holder nor the names of its contributors may be used to endorse or promote
// products derived from this software without specific prior written permission.
// THIS SOFTWARE IS PROVIDED BY THE COPYRIGHT HOLDERS AND CONTRIBUTORS "AS IS" AND ANY EXPRESS OR IMPLIED WARRANTIES,
// INCLUDING, BUT NOT LIMITED TO, THE IMPLIED WARRANTIES OF MERCHANTABILITY AND FITNESS FOR A PARTICULAR PURPOSE ARE
// DISCLAIMED. IN NO EVENT SHALL THE COPYRIGHT HOLDER OR CONTRIBUTORS BE LIABLE FOR ANY DIRECT, INDIRECT, INCIDENTAL,
// SPECIAL, EXEMPLARY, OR CONSEQUENTIAL DAMAGES (INCLUDING, BUT NOT LIMITED TO, PROCUREMENT OF SUBSTITUTE GOODS OR
// SERVICES; LOSS OF USE, DATA, OR PROFITS; OR BUSINESS INTERRUPTION) HOWEVER CAUSED AND ON ANY THEORY OF LIABILITY,
// WHETHER IN CONTRACT, STRICT LIABILITY, OR TORT (INCLUDING NEGLIGENCE OR OTHERWISE) ARISING IN ANY WAY OUT OF THE
// USE OF THIS SOFTWARE, EVEN IF ADVISED OF THE POSSIBILITY OF SUCH DAMAGE.

'''
          p.write_text(header + s)
          PY

          git rm .github/workflows/remediation_apply.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add infrastructure/tari_script/src/op_codes.rs \
                  base_layer/wallet/src/transaction_service/storage/sqlite_db.rs \
                  .github/workflows/ci.yml \
                  my_escrow_contract/src/lib.rs
          git commit -m "fix(ci): consolidate release blockers"
          git push origin HEAD:remediation/consolidated-2026-09-03
