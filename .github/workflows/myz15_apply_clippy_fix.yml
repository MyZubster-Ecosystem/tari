---
name: "MYZ-15 apply Clippy fix"

"on":
  pull_request:
    types:
      - opened
      - reopened

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.head_ref == 'myz-15-clippy-coercion-test'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: "myz-15-clippy-coercion-test"
      - name: Apply validated coercion fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('infrastructure/tari_script/src/op_codes.rs')
          s = p.read_text()
          old = '.map(CompressedKey::from_canonical_bytes)'
          new = '.map(|bytes| CompressedKey::from_canonical_bytes(&bytes[..]))'
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one failing map expression, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          git rm .github/workflows/myz15_apply_clippy_fix.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add infrastructure/tari_script/src/op_codes.rs
          git commit -m "fix(clippy): coerce public-key chunks to byte slices"
          git push origin HEAD:myz-15-clippy-coercion-test
